name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Check code quality ──────────────────
  check-code:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code style (lint)
        run: |
          pip install flake8
          flake8 app/

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/

  # ── JOB 2: Build and Push Docker image ──────────
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: check-code                    # Only runs if Job 1 passes
    if: github.event_name == 'push'      # Only build on actual pushes to main
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest

  # ── JOB 3: Deploy to server ────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-docker                  # Only runs if Job 2 passes
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Pull the latest image from GitHub Registry
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Stop and remove the old container (if it exists)
            docker stop my-app || true
            docker rm my-app || true
            
            # Start the new container
            docker run -d --name my-app -p 80:5000 ghcr.io/${{ github.repository }}:latest
            
            # Optional: Clean up old unused images to save space
            docker image prune -f
            echo "Deployed successfully at $(date)"